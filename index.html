<!DOCTYPE html>
<html lang="en" data-mode="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TimeTracker</title>
  <meta name="description" content="Offline-first time tracker for hourly tasks. All data stays on your device.">
  <!-- No dark mode, ever: opt out of browser auto-dark and Dark Reader. -->
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Tasks">
      <img src="./icons/icon-192.png" alt="" width="24" height="24">
      <span class="brand-text">TimeTracker</span>
    </a>
    <span class="topbar-status" id="topbar-status"></span>
    <nav class="topbar-actions" id="topbar-actions"></nav>
  </header>
  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
  <noscript>TimeTracker needs JavaScript.</noscript>
  <script>
    // Safety net: if the app has not started after 8 s (e.g. a broken offline
    // cache), offer a repair that clears ONLY the cached app files.
    // Your tasks live in IndexedDB and are not touched.
    setTimeout(function () {
      if (window.__httBooted) return;
      var v = document.getElementById('view');
      v.innerHTML = '<div class="card" style="margin-top:10vh"><h2>Taking too long?</h2><p>The saved copy of the app may be out of date. Repairing reloads the app files. Your tasks and logs are not affected.</p><button class="btn btn-primary" id="repair">Repair and reload</button></div>';
      document.getElementById('repair').onclick = async function () {
        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        } catch (e) {}
        location.reload();
      };
    }, 8000);
  </script>
</body>
</html>
