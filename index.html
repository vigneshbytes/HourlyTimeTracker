<!DOCTYPE html>
<html lang="en" data-mode="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TimeTracker</title>
  <meta name="description" content="Offline-first time tracker for hourly tasks. All data stays on your device.">
  <!-- No dark mode, ever: opt out of browser auto-dark and Dark Reader. -->
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Tasks">
      <img src="./icons/icon-192.png" alt="" width="24" height="24">
      <span class="brand-text">TimeTracker</span>
    </a>
    <span class="topbar-status" id="topbar-status"></span>
    <nav class="topbar-actions" id="topbar-actions"></nav>
  </header>
  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
  <noscript>TimeTracker needs JavaScript.</noscript>
</body>
</html>
